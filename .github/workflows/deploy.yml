name: Deploy server
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -1)
          unzip -q "$ZIP" -d src
          cd "$(dirname "$(find src -name package.json -not -path '*/node_modules/*' -not -path '*/functions/*' | head -1)")"
          PROJECT=$(node scripts/firebase-config.mjs project)
          echo "Deploying to project $PROJECT"
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo "ANDROID_PACKAGE_NAME=bh.kout.game" > functions/.env
          npm --prefix functions ci
          npx -y firebase-tools@15 deploy --only functions,firestore,hosting --project "$PROJECT" --non-interactive --force
